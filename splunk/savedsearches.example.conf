# =============================================================================
# SPARKSOC — example Splunk Enterprise correlation searches
#
# Install into $SPLUNK_HOME/etc/apps/<your-detection-app>/local/savedsearches.conf
# on the search head, then reload:
#     | rest /services/admin/savedsearch/_reload
#
# Design notes that matter for this pipeline:
#
#  * `dispatch.earliest_time = -5m@m` with `cron_schedule = */5 * * * *` gives
#    a real-time-ish cadence without real-time search, which is expensive and
#    behaves badly on a search head that also serves ad-hoc analysts.
#
#  * `alert.digest_mode = 1` matters. In digest mode the alert action fires ONCE
#    with the whole result set, which is what TA-soc-harness is built for. In
#    per-result mode you get one harness call per row, which floods the queue and
#    denies the triage model the pattern across rows.
#
#  * Keep `| table` explicit. Whatever fields you emit are what the model sees;
#    dumping every field wastes context on Splunk internals.
#
#  * `alert.suppress` is set conservatively. The harness dedupes independently
#    (DEDUPE_TTL_SECONDS), but suppressing at the Splunk end saves the round trip.
# =============================================================================

# -----------------------------------------------------------------------------
[SPARKSOC - Suspicious PowerShell Execution]
search = index=range sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 \
    (CommandLine="*-enc*" OR CommandLine="*-EncodedCommand*" OR CommandLine="*FromBase64String*" \
     OR CommandLine="*-nop*" OR CommandLine="*-w hidden*" OR CommandLine="*IEX*" \
     OR CommandLine="*DownloadString*" OR CommandLine="*Invoke-Expression*") \
    Image="*\\powershell.exe" OR Image="*\\pwsh.exe" \
    | eval risk_note="encoded or obfuscated PowerShell invocation" \
    | table _time host User Image CommandLine ParentImage ParentCommandLine ProcessGuid Hashes risk_note
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
quantity = 0
relation = greater than
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 5m
alert.suppress.fields = host,User
action.soc_harness = 1
action.soc_harness.param.harness_url = http://10.90.1.40:8080/v1/alert
action.soc_harness.param.shared_secret = $SPLUNK_HMAC_SECRET$
action.soc_harness.param.severity = high
action.soc_harness.param.labels = range,windows,execution
description = Encoded or obfuscated PowerShell. Maps to T1059.001 / T1027.

# -----------------------------------------------------------------------------
[SPARKSOC - Credential Dumping Indicators]
search = index=range sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational \
    (EventCode=10 TargetImage="*\\lsass.exe" \
       AND (GrantedAccess="0x1010" OR GrantedAccess="0x1410" OR GrantedAccess="0x143a" OR GrantedAccess="0x1fffff")) \
    OR (EventCode=1 (CommandLine="*procdump*lsass*" OR CommandLine="*comsvcs.dll*MiniDump*" \
       OR CommandLine="*mimikatz*" OR CommandLine="*sekurlsa*")) \
    | table _time host User SourceImage TargetImage GrantedAccess CallTrace Image CommandLine ParentImage
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
quantity = 0
relation = greater than
alert.severity = 5
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 10m
alert.suppress.fields = host
action.soc_harness = 1
action.soc_harness.param.harness_url = http://10.90.1.40:8080/v1/alert
action.soc_harness.param.shared_secret = $SPLUNK_HMAC_SECRET$
action.soc_harness.param.severity = critical
action.soc_harness.param.labels = range,windows,credential-access
description = LSASS access or known dumping tooling. Maps to T1003.001.

# -----------------------------------------------------------------------------
[SPARKSOC - Persistence Mechanism Created]
search = index=range \
    ( sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational \
        (EventCode=1 (Image="*\\schtasks.exe" CommandLine="*/create*") OR (Image="*\\sc.exe" CommandLine="*create*")) \
        OR (EventCode=13 TargetObject="*\\CurrentVersion\\Run*") \
        OR (EventCode=12 TargetObject="*\\CurrentVersion\\RunOnce*") \
        OR EventCode=19 OR EventCode=20 OR EventCode=21 ) \
    OR ( sourcetype=WinEventLog:Security EventCode=4698 ) \
    | table _time host User EventCode Image CommandLine TargetObject Details TaskName Operation
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
quantity = 0
relation = greater than
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 10m
alert.suppress.fields = host
action.soc_harness = 1
action.soc_harness.param.harness_url = http://10.90.1.40:8080/v1/alert
action.soc_harness.param.shared_secret = $SPLUNK_HMAC_SECRET$
action.soc_harness.param.severity = high
action.soc_harness.param.labels = range,windows,persistence
description = Scheduled task, service, Run key or WMI subscription created. T1053 / T1543 / T1547 / T1546.003.

# -----------------------------------------------------------------------------
[SPARKSOC - Lateral Movement Indicators]
search = index=range \
    ( sourcetype=WinEventLog:Security EventCode=4624 Logon_Type IN (3,10) \
        NOT Account_Name IN ("*$", "ANONYMOUS LOGON") ) \
    OR ( sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 \
        (Image="*\\psexec*" OR Image="*\\wmic.exe" OR ParentImage="*\\wsmprovhost.exe" \
         OR ParentImage="*\\wmiprvse.exe" OR CommandLine="*Enter-PSSession*" OR CommandLine="*Invoke-Command*") ) \
    | stats count min(_time) as _time values(Image) as Image values(CommandLine) as CommandLine \
            values(Logon_Type) as Logon_Type values(Source_Network_Address) as src_ip \
        by host, User \
    | where count > 2 \
    | table _time host User count Image CommandLine Logon_Type src_ip
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
quantity = 0
relation = greater than
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 10m
alert.suppress.fields = host,User
action.soc_harness = 1
action.soc_harness.param.harness_url = http://10.90.1.40:8080/v1/alert
action.soc_harness.param.shared_secret = $SPLUNK_HMAC_SECRET$
action.soc_harness.param.severity = high
action.soc_harness.param.labels = range,windows,lateral-movement
description = Remote logons plus remote execution tooling on the same host. T1021 / T1047 / T1570.

# -----------------------------------------------------------------------------
[SPARKSOC - Linux Suspicious Activity]
search = index=range (sourcetype=linux_audit OR sourcetype=auditd OR sourcetype=linux_secure) \
    ( "*/etc/cron*" OR "*systemctl enable*" OR "*chmod +s*" OR "*authorized_keys*" \
      OR "*nc -e*" OR "*/dev/tcp/*" OR "*base64 -d*" OR "*curl*|*sh*" OR "*wget*|*sh*" ) \
    | table _time host user comm exe cmdline auid syscall key
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
quantity = 0
relation = greater than
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 10m
alert.suppress.fields = host
action.soc_harness = 1
action.soc_harness.param.harness_url = http://10.90.1.40:8080/v1/alert
action.soc_harness.param.shared_secret = $SPLUNK_HMAC_SECRET$
action.soc_harness.param.severity = high
action.soc_harness.param.labels = range,linux,persistence
description = Linux persistence and reverse-shell indicators on RHEL range targets.

# =============================================================================
# Baseline searches referenced by the SOAR `correlate_splunk_history` action.
# These are the ONLY searches the reasoning model can invoke, by name, from the
# enum in common/action_allowlist.yaml. It cannot compose SPL.
# =============================================================================

[SPARKSOC - Host Baseline - Process Frequency]
search = index=range sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 host=$target_host$ \
    | stats count, min(_time) as first_seen, max(_time) as last_seen by Image \
    | eval first_seen=strftime(first_seen,"%F %T"), last_seen=strftime(last_seen,"%F %T") \
    | sort - count | head 100
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 0
description = How often has each binary run on this host over 30 days? New binaries stand out.

[SPARKSOC - Host Baseline - Logon Patterns]
search = index=range sourcetype=WinEventLog:Security EventCode=4624 host=$target_host$ \
    | stats count, values(Logon_Type) as logon_types, min(_time) as first_seen by Account_Name \
    | eval first_seen=strftime(first_seen,"%F %T") | sort - count | head 100
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 0
description = Which accounts normally log on to this host, and how?

[SPARKSOC - Host Baseline - Outbound Destinations]
search = index=range sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=3 host=$target_host$ \
    | stats count, values(DestinationPort) as ports, min(_time) as first_seen by DestinationIp, DestinationHostname \
    | eval first_seen=strftime(first_seen,"%F %T") | sort - count | head 100
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 0
description = Normal outbound destinations for this host. New destinations are the C2 signal.

[SPARKSOC - Related Alerts By Host 24h]
search = index=notable OR index=range host=$target_host$ \
    | search source="*SPARKSOC*" OR search_name="SPARKSOC*" \
    | table _time search_name host user signature | sort - _time | head 50
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 0
description = Other SPARKSOC detections on this host in the last day.

[SPARKSOC - Related Alerts By User 24h]
search = index=notable OR index=range user=$target_host$ \
    | search source="*SPARKSOC*" OR search_name="SPARKSOC*" \
    | table _time search_name host user signature | sort - _time | head 50
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 0
description = Other SPARKSOC detections involving this account in the last day.
