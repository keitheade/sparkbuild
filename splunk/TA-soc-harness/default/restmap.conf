# Validation for the alert action's configuration, so a misconfigured alert
# fails at save time rather than silently at fire time.
[validation:savedsearch]
action.soc_harness.param.harness_url = validate( match('action.soc_harness.param.harness_url', "^https?://[^\s]+/v1/alert$"), "harness_url must be a full URL ending in /v1/alert")
action.soc_harness.param.timeout = validate( is_nonneg_int('action.soc_harness.param.timeout'), "timeout must be a non-negative integer")
